name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Type of version bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute new version
        id: version
        run: |
          CURRENT=$(git tag --sort=-version:refname | grep '^v' | head -1)
          CURRENT=${CURRENT:-v0.0.0}
          MAJOR=$(echo $CURRENT | sed 's/v//' | cut -d. -f1)
          MINOR=$(echo $CURRENT | sed 's/v//' | cut -d. -f2)
          PATCH=$(echo $CURRENT | sed 's/v//' | cut -d. -f3)
          case "${{ github.event.inputs.bump_type }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          echo "NEW_VERSION=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_ENV

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT }}
          commit-message: "chore: bump version to v${{ env.NEW_VERSION }}"
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          branch: "chore/version-bump-v${{ env.NEW_VERSION }}"
          title: "chore: bump version to v${{ env.NEW_VERSION }}"
          body: |
            Bumping version to v${{ env.NEW_VERSION }}
            - Bump type: ${{ github.event.inputs.bump_type }}
          labels: |
            version-bump
            automated-pr
